<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>업무기록 위젯 테스트</title>
    <style>
      .noteWidget {
        width: 1000px;
        height: 600px;
        background-color: #efefef;
        border-radius: 75px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: flex;
        justify-content: space-around;
        flex-direction: row;
        flex-shrink: 0; /* header 영역은 고정 */
      }

      #title {
        font-size: 64px;
        font-weight: bold;
        width: 400px;
        height: 85px;
        margin: 50px 0 0 40px;
        display: flex; /* 자식요소 flex 사용 */
        flex-direction: row; /* 자식요소 가로 배치 */
      }

      #input {
        width: 440px;
        height: 60px;
        display: flex;
        margin: 30px;
        margin-top: 50px;

        font-size: 40px;
        flex-direction: row;
      }
      #addBtn {
        width: 79px;
        height: 60px;
        margin-top: 50px;
        margin-right: 40px;
        font-size: 30px;
      }
      li {
        font-size: 50px;
        margin: 40px;
      }

      #listContainer {
        flex: 1;
        overflow-y: auto;
      }

      li.completed {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <div class="noteWidget">
      <div class="header">
        <div id="title">TO DO LIST</div>
        <input type="text" id="input" placeholder="할 일 입력" />
        <button id="addBtn" onclick="addList()">추가</button>
      </div>
      <div id="listContainer">
        <ul></ul>
      </div>
    </div>

    <script>
      const ul = document.querySelector("ul"); // ul 태그 선택
      // 형식 :
      const input = document.querySelector("input"); // input 태그 선택

      const LIMIT_TIME = 24 * 60 * 60 * 1000; // 24시간 -> 밀리초 계산

      // 리스트 띄우기
      function renderList() {
        ul.innerHTML = ""; // ul 태그 초기화
        let list = JSON.parse(localStorage.getItem("list")) || [];
        const now = Date.now(); // 밀리초 현재 시간

        list = list.filter((item) => {
          // 완료(true) + 완료 시간(not null)
          // 완료된 항목만 필터링
          if (item.completed && item.completeTime) {
            if (now - item.completeTime < LIMIT_TIME) {
              return true; // 24시간 미만 - 유지
            } else {
              return false; // 24시간 이상 - 제거
            }
          }
          return true; // 완료되지 않은 항목 유지
        });

        localStorage.setItem("list", JSON.stringify(list));

        for (let i = 0; i < list.length; i++) {
          const li = document.createElement("li");
          li.innerHTML = list[i].text;

          if (list[i].completed) {
            li.classList.add("completed");
          }
          li.onclick = function () {
            // 클릭 시 완료 처리
            completeList(i);
          };

          ul.appendChild(li);
        }
      }

      function completeList(index) {
        const list = JSON.parse(localStorage.getItem("list")) || [];
        const now = Date.now();

        if (!list[index].completed) {
          list[index].completed = true;
          list[index].completeTime = now; // 완료 시간
        } else {
          list[index].completed = false;
          list[index].completeTime = null;
        }

        localStorage.setItem("list", JSON.stringify(list));

        renderList();
      }

      // 리스트 추가
      function addList() {
        const input_value = input.value.trim(); // 사용자가 입력한 값

        if (input_value === "") {
          return;
        }

        const list = JSON.parse(localStorage.getItem("list")) || [];
        list.push({
          text: input_value, // 사용자가 입력한 값 (string)
          completed: false, // 완료 여부 (boolean)
          createdAt: Date.now(), // 리스트 등록 시간 (number)
          completedTime: null, // 완료한 시간 (number)
        });
        localStorage.setItem("list", JSON.stringify(list)); // 배열 -> 문자열 => 저장

        renderList();

        // document.getElementById("input").value = ""; // 입력창 초기화
        input.value = "";
      }

      renderList();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>알람 위젯</title>
    <style>
      .widget {
        /*큰 네모*/
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        width: 500px;
        height: 500px;
        margin: 300px auto 0px auto;
        padding-top: 32px;
        background-color: #efefef;
        border-radius: 116px;
      }

      .top {
        /*아이콘 + 시간이 들어가는 윗줄*/
        display: flex;
        align-items: center;
        width: 432px;
        height: 160px;
      }

      #clock {
        /*알람 아이콘*/
        width: 160px;
        height: 160px;
        margin-left: 13px;
      }

      .time {
        /*현제 시각*/
        margin-left: 40px;
        font-size: 64px;
        font-weight: bold;
        line-height: 80px;
        color: #555555;
      }

      .info {
        /*빈칸*/
        display: flex;
        align-items: center;
        justify-content: center;
        width: 432px;
        height: 113px;
        margin-top: 19px;
        font-size: 50px;
        font-weight: bold;
        color: #555555;
        background-color: #cfcfcf;
        border-radius: 56px;
      }

      #addAlarmBtn {
        /*아래 빈칸 = + 버튼*/
        padding: 0px;
        border: none;
        font-size: 80px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="widget">
      <div class="top">
        <img id="clock" src="../assets/clock.svg" alt="알람" />
        <div class="time">
          <div id="ampmText">오후</div>
          <div id="timeText">07:17</div>
        </div>
      </div>

      <div class="info">설정된 알람 없음</div>
      <button type="button" class="info" id="addAlarmBtn">+</button>
    </div>

    <script>
      const ampmText = document.getElementById("ampmText");
      const timeText = document.getElementById("timeText");
      const addAlarmBtn = document.getElementById("addAlarmBtn");

      // 숫자를 두 자리로 (7 -> "07")
      function pad(n) {
        return String(n).padStart(2, "0");
      }

      // 현재 시각을 읽어서 화면에 넣는 함수
      function updateClock() {
        const now = new Date();
        let hour = now.getHours();
        const min = now.getMinutes();

        const ampm = hour >= 12 ? "오후" : "오전";

        hour = hour % 12; // 13시 -> 1시
        if (hour === 0) {
          hour = 12; // 0시, 12시는 12로 표시
        }

        ampmText.textContent = ampm;
        timeText.textContent = pad(hour) + ":" + pad(min);
      }

      // 1. 처음에 한 번 바로 실행
      updateClock();

      // 2. 그 뒤로 1초마다 다시 실행해서 실시간으로 바꾸기
      setInterval(updateClock, 1000);

      // 3. + 버튼 누르면 (나중에 알람 설정창으로 이동시킬 자리)
      addAlarmBtn.addEventListener("click", function () {
        // TODO: 알람 설정창으로 이동
      });
    </script>
  </body>
</html>
